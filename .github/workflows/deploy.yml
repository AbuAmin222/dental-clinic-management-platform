name: Dental Clinic Continuous Integration & Deployment Pipeline

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-assurance:
    name: Code Auditing & Unit Testing
    runs-on: ubuntu-latest

    services:
      mysql-test:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: clinic_test
          MYSQL_USER: runner
          MYSQL_PASSWORD: testing_password
          MYSQL_ROOT_PASSWORD: root_testing_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Source Code Repository
      uses: actions/checkout@v4

    - name: Setup PHP Environment Framework
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: pdo_mysql, gd, zip
        tools: composer:v2

    - name: Set Up Node.js Environment Engine
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Cache Composer Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.composer/cache/files
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Application Backend Core Dependencies
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Install Frontend Node Dependencies & Compile Assets
      run: |
        npm ci
        npm run build

    - name: Prepare Testing Configuration Profiles
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run Test Suite Execution Framework
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: clinic_test
        DB_USERNAME: runner
        DB_PASSWORD: testing_password
        CACHE_STORE: array
        SESSION_DRIVER: array
        QUEUE_CONNECTION: sync
      run: php artisan test --parallel

    # - name: Deploy to Live Server via SSH
    #   uses: appleboy/ssh-action@master
    #   with:
    #     host: ${{ secrets.SERVER_IP }}
    #     username: ${{ secrets.SERVER_USER }}
    #     key: ${{ secrets.SERVER_SSH_KEY }}
    #     script: |
    #       cd /path/to/dental-clinic
    #       docker compose pull
    #       docker compose up -d

  build-and-ship:
      name: Build & Push Production Image Stack
      needs: quality-assurance
      if: github.ref == 'refs/heads/production'
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx Setup Core
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Container Registry Access
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Production Containers
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/clinic-app:latest
            ghcr.io/${{ github.repository }}/clinic-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-production:
    name: Deploy to Live Server
    needs: build-and-ship
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Live Server via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /path/to/dental-clinic
          docker compose pull
          docker compose up -d
